# Codemagic: builds the iPad app and uploads it to TestFlight.
# Before the first run, fill in the two values marked FILL IN.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # FILL IN: the name you gave the App Store Connect API key in Codemagic
      # (Team settings → Integrations → Developer Portal).
      app_store_connect: ASC API key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cafe505.pos
      vars:
        # FILL IN: the numeric "Apple ID" of the app (App Store Connect → the app → App Information).
        APP_STORE_APPLE_ID: 0000000000
        # Expo names the native project after "name" in app.json ("Cafe POS" → CafePOS).
        XCODE_WORKSPACE: ios/CafePOS.xcworkspace
        XCODE_SCHEME: CafePOS
      node: 24
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate the iOS project
        # ios/ is not committed; prebuild creates it from app.json and runs pod install.
        script: npx expo prebuild --platform ios --clean --no-install && cd ios && pod install
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios && agvtool new-version -all $((LATEST + 1))
      - name: Build .ipa
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
