# Codemagic: builds the iPad app and uploads it to TestFlight.
# App Store Connect app: 505 Coffee POS (com.cafe505.pos).
#
# Signing is done with the App Store Connect API key, so nothing has to be created by hand in the
# Apple Developer portal: each build finds (or creates) the App Store provisioning profile itself.
# Needs the Codemagic environment variable group "505 env" (Team settings → Global variables
# and secrets), every variable marked Secure:
#   APP_STORE_CONNECT_ISSUER_ID       Issuer ID of the API key
#   APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID of the API key
#   APP_STORE_CONNECT_PRIVATE_KEY     full text of the AuthKey_XXXX.p8 file
#   CERTIFICATE_PRIVATE_KEY           private key of the distribution certificate (taken out of the .p12)
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # The App Store Connect API key in Codemagic (Team settings → Integrations → Developer Portal),
      # used for the TestFlight upload.
      app_store_connect: code magic
    environment:
      groups:
        - "505 env"
      vars:
        BUNDLE_ID: com.cafe505.pos
        # The numeric "Apple ID" of the app (App Store Connect → the app → App Information).
        APP_STORE_APPLE_ID: 6836797630
        # Expo names the native project after "name" in app.json ("Cafe POS" → CafePOS).
        XCODE_WORKSPACE: ios/CafePOS.xcworkspace
        XCODE_SCHEME: CafePOS
      node: 24
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate the iOS project
        # ios/ is not committed; prebuild creates it from app.json, then CocoaPods installs the native modules.
        script: npx expo prebuild --platform ios --clean --no-install && cd ios && pod install
      - name: Fetch or create signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios && agvtool new-version -all $((LATEST + 1))
      - name: Build .ipa
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
